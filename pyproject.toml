# Written by hand: Fern's local generation writes no package metadata. scripts/generate.sh reads
# the version from here. Dependencies match what the Fern Python generator declares.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "affinity-health-sdk"
version = "0.8.0"
description = "Server-side Python client for the Affinity API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Affinity", email = "support@affinityrx.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.21.2",
  "pydantic>=1.9.2",
  "pydantic-core>=2.18.2,<3.0.0",
  "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-asyncio>=0.23.5"]

[project.urls]
Homepage = "https://github.com/affinity-health/affinity-python"
Documentation = "https://docs.affinityrx.com"

[tool.hatch.build.targets.wheel]
packages = ["src/affinity"]

[tool.hatch.build.targets.sdist]
include = ["src/affinity", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
