name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: ./tests/with-fixtures.sh sh -c 'python tests/smoke.py && python tests/approved.py && python tests/docs_approved.py'
